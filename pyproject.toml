[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hangman-arena-agent"
version = "0.1.0"
description = "Agent workspace for Hangman Arena: game rules engine and the `arena` CLI client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hangman Arena maintainers" }]
keywords = ["llm", "agents", "benchmark", "hangman", "in-context-learning", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
arena = "arena_client.cli:main"

[project.urls]
Homepage = "https://github.com/kargal/hangman-arena-agent"
Arena = "https://github.com/kargal/hangman-arena"
Issues = "https://github.com/kargal/hangman-arena-agent/issues"
Changelog = "https://github.com/kargal/hangman-arena-agent/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["hangman_engine", "arena_client"]

[tool.hatch.build.targets.sdist]
include = ["hangman_engine", "arena_client", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["hangman_engine", "arena_client"]

[tool.pytest.ini_options]
testpaths = ["tests", "hangman_engine", "arena_client"]
addopts = "-q --doctest-modules"
